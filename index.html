<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali 🪔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500&display=swap">
<style>
:root{--bg:#0a0c10;--gold:#ffd966;--amber:#ffb347;--cream:#fff5e6;--ease:cubic-bezier(.23,1,.32,1);--head:'Cormorant Garamond',Georgia,serif;--body:'Poppins',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--body);touch-action:none;user-select:none}
body{background:radial-gradient(circle at 50% 110%,#3a1d08,var(--bg) 60%)}
body.shake{animation:shk .6s}
@keyframes shk{10%,50%,90%{transform:translate(-12px,8px)}30%,70%{transform:translate(12px,-8px)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.glass{background:rgba(24,18,12,.7);border:1px solid rgba(255,217,102,.4);border-radius:28px;box-shadow:0 0 40px rgba(255,179,71,.2)}
.gold{font-family:var(--head);font-weight:700;margin:0;color:var(--gold);text-shadow:0 0 18px rgba(255,179,71,.6)}
.card{width:min(92vw,480px);padding:34px 26px;text-align:center}
.card input{width:100%;margin:20px 0 8px;padding:15px;font:400 1rem var(--body);color:var(--cream);background:rgba(10,12,16,.6);border:1px solid rgba(255,217,102,.5);border-radius:999px;outline:none;text-align:center;user-select:text}
.err{min-height:1.2em;font-size:.82rem;color:#ff6fa3}
button.go{font:500 1rem var(--body);color:#2b1a00;padding:13px 32px;min-height:46px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#fff0b8,var(--gold),var(--amber));box-shadow:0 0 22px rgba(255,179,71,.55)}
.st{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transform:scale(1.12);filter:blur(10px);transition:opacity .8s,transform 1s var(--ease),filter .8s;display:grid;place-items:center}
.st.on{opacity:1;pointer-events:auto;transform:none;filter:none}
.ttl{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 clamp(1.3rem,5vw,2rem) var(--head);color:var(--gold);padding:0 60px}
.floor{position:absolute;left:0;right:0;bottom:0;height:34vh;background:linear-gradient(#2a1a0e,#0c0806);border-top:2px solid rgba(255,179,71,.4)}
.floor::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,217,102,.5) 0 2px,transparent 3px) 0 0/44px 36px}
#msg{position:fixed;left:50%;top:22%;z-index:60;max-width:90vw;text-align:center;font:700 clamp(1.4rem,6vw,2.6rem)/1.3 var(--head);color:var(--cream);text-shadow:0 0 24px #ff9a2e,0 3px 12px #000;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none}
#msg.on{animation:pop .5s var(--ease) forwards}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#box{position:fixed;left:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:66px;z-index:30;border-radius:8px;background:linear-gradient(#b3261e,#6e120d);border:2px solid #f3c75a;display:none;place-items:center;font:700 .75rem var(--body);color:#ffe9a8;letter-spacing:.1em;text-align:center}
#box::after{content:"";position:absolute;inset:auto 8px 6px;height:10px;background:repeating-linear-gradient(90deg,#3a0f0b 0 3px,#6b2a1c 3px 6px);border-radius:3px}
#match{position:fixed;left:0;top:0;width:30px;height:90px;margin-left:-15px;z-index:50;display:none;touch-action:none;transform-origin:50% 0;cursor:grab}
#match i{display:block;margin:0 auto;width:8px;height:88px;border-radius:5px;background:linear-gradient(#d22 0 13%,#e0b878 13%);box-shadow:0 0 8px #000}
#match::before{content:"";position:absolute;left:50%;top:-34px;width:20px;height:38px;margin-left:-10px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff,#ffd966 40%,#ff7a2e);box-shadow:0 0 22px 8px rgba(255,150,40,.8);display:none;animation:fk .15s infinite alternate}
#match.lit::before{display:block}
@keyframes fk{to{transform:scale(1.15,.9) skewX(5deg)}}
body.tools #box,body.tools #match{display:grid}
body.tools #match{display:block}
#nx{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;display:none;animation:bn 1.4s infinite}
@keyframes bn{50%{transform:translateX(-50%) translateY(-8px)}}
#tut{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .5s}
#tut.on{opacity:1;pointer-events:auto}
#tut .card{transform:scale(.8);transition:transform .6s var(--ease)}#tut.on .card{transform:none}
#tut p{line-height:1.6;font-weight:300}
.fg{font-size:2.6rem;display:inline-block;animation:sw 1.6s infinite}
@keyframes sw{0%{transform:translate(-40px,20px)}60%,100%{transform:translate(40px,-20px)}}
#mute{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:90;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(10,12,16,.6);color:var(--gold);font-size:1.1rem;cursor:pointer}
#gl{position:fixed;top:-30vh;left:-50vw;width:40vw;height:160vh;z-index:70;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,236,170,.85),transparent);transform:rotate(18deg);opacity:0}
#gl.on{animation:gl 1.1s ease-in-out}
@keyframes gl{0%{opacity:1;transform:translateX(0) rotate(18deg)}100%{opacity:1;transform:translateX(190vw) rotate(18deg)}}
#flash{position:fixed;inset:0;z-index:75;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl 1.5s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.dys{display:grid;grid-template-columns:repeat(3,auto);gap:clamp(10px,4vw,30px);justify-content:center;margin-top:6vh}
.dy{position:relative;width:clamp(58px,16vw,100px);height:clamp(58px,16vw,100px);border:0;background:none;font-size:clamp(3rem,13vw,5.4rem);line-height:1;cursor:pointer;filter:grayscale(.8) brightness(.55);transition:filter .5s,transform .4s var(--ease);padding:0}
.dy:hover{transform:scale(1.1)}
.dy::after{content:"";position:absolute;left:50%;top:-4%;width:26%;height:46%;margin-left:-13%;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff,#ffd966 40%,#ff7a2e);box-shadow:0 0 30px 10px rgba(255,160,50,.9);transform:scale(0);transform-origin:50% 100%;transition:transform .5s var(--ease)}
.dy.lit{filter:none;animation:bob 2.6s ease-in-out infinite}
.dy.lit::after{transform:scale(1);animation:fk .18s infinite alternate}
.dy.gld{filter:drop-shadow(0 0 25px gold) sepia(.7) saturate(2.5) brightness(1.3);animation:bob 1.6s infinite}
.dy.gld::after{background:radial-gradient(#fff,#ffe27a 40%,#ffb300);box-shadow:0 0 50px 20px rgba(255,215,0,.95);transform:scale(1.5)}
@keyframes bob{50%{transform:translateY(-8px)}}
#ck{position:absolute;width:76px;height:76px;margin:-38px;border-radius:50%;z-index:12;display:none;touch-action:none;background:repeating-conic-gradient(from 0deg,#d9a441 0 12deg,#7a3b12 12deg 24deg);border:3px solid #5a2a0a;box-shadow:0 0 18px rgba(255,160,50,.4)}
#ck::after{content:"";position:absolute;inset:34%;border-radius:50%;background:#222}
#an{position:absolute;width:84px;height:130px;margin-left:-42px;z-index:12;display:none;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);background:repeating-linear-gradient(0deg,#c0392b 0 14px,#f1c40f 14px 22px)}
#bomb{position:absolute;width:130px;height:130px;margin:-65px;border-radius:50%;z-index:12;background:radial-gradient(circle at 35% 30%,#7a7a82,#1a1a1f 55%,#050507);box-shadow:0 10px 30px #000;display:none}
#fuse{position:absolute;left:50%;bottom:97%;width:5px;height:56px;margin-left:-2px;background:linear-gradient(#c9a063,#6b4a1e);border-radius:3px;transform-origin:50% 100%;transform:rotate(14deg);transition:height 2.4s linear}
#fuse.short{height:24px}#fuse.burn{height:6px}
#fz{position:absolute;left:-7px;top:-8px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff,#ffb347 50%,#ff3b1e);box-shadow:0 0 20px 8px rgba(255,120,30,.9);visibility:hidden}
#fz.on{visibility:visible;animation:fk .1s infinite alternate}
#cu{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#2a1c10,#050403);display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(1.4);transition:opacity .8s,transform 1.2s var(--ease)}
#cu.on{opacity:1;transform:none}
#cu svg{width:96vw;max-height:70vh}
#rg{width:min(94vw,58vh);height:min(94vw,58vh);margin-bottom:12vh}
#rg .r{fill:rgba(255,255,255,.03);stroke:#fff;stroke-width:1.6;stroke-linejoin:round;cursor:pointer;transition:fill .5s}
#rg .r:hover{fill:rgba(255,255,255,.18)}#rg .r.f:hover{filter:brightness(1.15)}
#pal{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
#pal button{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.6);cursor:pointer;transition:transform .3s var(--ease)}
#pal button.sel{transform:scale(1.3);border-color:#fff;box-shadow:0 0 18px #fff}
#greet{position:fixed;inset:0;z-index:15;display:grid;place-items:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity 1s,transform 1.4s var(--ease)}
#greet.on{opacity:1;transform:none}
#greet h2{font-size:clamp(1.8rem,7vw,3.6rem);line-height:1.3;max-width:90vw}
.ground{position:fixed;left:0;right:0;bottom:0;height:17vh;z-index:3;opacity:0;transition:opacity .6s;pointer-events:none;border-top:1px solid rgba(255,179,71,.35);background:linear-gradient(#1c1510,#0a0806)}.ground.on{opacity:1}
.nm{position:fixed;left:50%;top:50%;z-index:6;max-width:36vw;text-align:center;overflow-wrap:anywhere;font-size:clamp(2rem,8vw,4.6rem);line-height:1.1;transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none;transition:opacity .4s,transform 1.2s ease-in-out}.nm.in{opacity:1}.nm.zoom{transform:translate(-50%,-50%) scale(2.5)}.nm.attach{opacity:0;transition:transform .7s ease-in,opacity .7s ease-in}
.rk{position:fixed;left:0;top:0;width:100px;height:360px;z-index:4;opacity:0;pointer-events:none;transition:opacity .5s;will-change:transform;filter:drop-shadow(0 0 18px rgba(255,179,71,.35))}.rk.show{opacity:1}.rk svg{width:100%;height:100%;display:block;overflow:visible}#rname{transition:opacity .8s}#flame{animation:ff .1s infinite alternate}@keyframes ff{to{transform:scale(.85,1.2)}}
.slides{position:fixed;inset:0;z-index:12;opacity:0;pointer-events:none;transition:opacity .6s}.slides.live{opacity:1;pointer-events:auto}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding:20px 20px 130px;opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease)}.slide.on{opacity:1}
.card2{width:min(92vw,620px);padding:clamp(26px,5.5vw,48px);text-align:center;transform:translateY(46px) scale(.92) rotate(-2.5deg);filter:blur(4px);transition:transform 1.2s var(--ease),filter 1.2s var(--ease)}.slide.on .card2{transform:none;filter:none}.slide.out .card2{transform:translateY(-24px) scale(1.06) rotate(2deg);filter:blur(3px)}
.card2 h2{font:700 clamp(1.7rem,6vw,3rem)/1.2 var(--head);margin:10px 0 14px;overflow-wrap:anywhere}.card2 p{max-width:44ch;margin:0 auto;font-weight:300;line-height:1.75}
.w{display:inline-block;opacity:0;transform:translateY(24px) scale(.8);color:var(--gold);text-shadow:0 0 14px rgba(255,179,71,.6)}.slide.on .w{animation:wIn .8s var(--ease) calc(.4s + var(--i)*.07s) forwards}.slide.out .w{opacity:1;transform:none}@keyframes wIn{to{opacity:1;transform:none}}
.big{font-size:3.2rem;animation:bob 3s ease-in-out infinite}
.lamp{position:relative;height:104px;display:flex;justify-content:center}.lamp svg{position:relative;z-index:1}.halo{position:absolute;left:50%;top:34%;width:280px;height:280px;margin:-140px 0 0 -140px;background:radial-gradient(circle,rgba(255,200,90,.5),transparent 65%);animation:hp 2.4s ease-in-out infinite}@keyframes hp{50%{transform:scale(1.18);opacity:.7}}.fl{transform-origin:60px 52px;animation:fk .18s ease-in-out infinite alternate}
.dots{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:30}.dot{width:14px;height:14px;padding:0;border-radius:50%;border:1px solid rgba(255,217,102,.6);background:transparent;cursor:pointer;transition:all .4s}.dot.on{background:var(--gold);box-shadow:0 0 14px 3px rgba(255,217,102,.8);transform:scale(1.25)}
.off{display:none!important}
#wnx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:31}
</style></head><body>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Mute">🔊</button><div id="gl"></div><div id="flash"></div><div id="msg"></div>

<main class="st on" id="intro">
  <form class="glass card" id="f1" novalidate><p style="letter-spacing:.3em;font-size:.7rem;color:var(--amber);margin:0 0 6px">FESTIVAL OF LIGHTS</p><h1 class="gold">Diwali Greetings 🪔</h1>
    <input id="name" maxlength="30" placeholder="Enter the name of the person you wish to greet…" aria-label="Name"><div class="err" id="e1"></div><button class="go">Celebrate 🎆</button></form>
  <form class="glass card off" id="f2" novalidate><h1 class="gold">Secret Word 🔐</h1><p style="color:var(--amber);font:italic 600 1.1rem var(--head)">Hmm… I think we know each other. What is our secret word?</p>
    <input id="pw" type="password" placeholder="Whisper the secret word…" aria-label="Secret word"><div class="err" id="e2"></div><button class="go">Unlock 🔓</button></form>
</main>
<section id="greet"><h2 class="gold"></h2></section>
<div class='ground' id='ground'></div><div class='nm gold' id='nm' aria-hidden='true'></div>
<div class='rk' id='rk' aria-hidden='true'><svg viewBox='0 0 100 360'><defs><linearGradient id='bodyG' x1='0' x2='1'><stop offset='0' stop-color='#c9a24a'/><stop offset='.35' stop-color='#fff8e8'/><stop offset='.7' stop-color='#f1dca6'/><stop offset='1' stop-color='#b98a2d'/></linearGradient><linearGradient id='noseG' x1='0' x2='1'><stop offset='0' stop-color='#a30f45'/><stop offset='.4' stop-color='#ff4d8f'/><stop offset='1' stop-color='#8d0e3c'/></linearGradient><linearGradient id='finG' x1='0' x2='1'><stop offset='0' stop-color='#ff4d8f'/><stop offset='1' stop-color='#a30f45'/></linearGradient><linearGradient id='flG' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.3' stop-color='#ffe27a'/><stop offset='.65' stop-color='#ff9a2e'/><stop offset='1' stop-color='#ff4d8f' stop-opacity='0'/></linearGradient></defs><g id='flame' style='transform-origin:50px 292px;opacity:0'><path d='M35 290 Q50 440 65 290 Q50 306 35 290Z' fill='url(#flG)'/></g><path d='M46 232 L50 312 L54 232Z' fill='#8d0e3c'/><path d='M24 212 L-4 302 L24 268Z' fill='url(#finG)' stroke='#6e0a2e'/><path d='M76 212 L104 302 L76 268Z' fill='url(#finG)' stroke='#6e0a2e'/><path d='M22 90 H78 L75 270 H25Z' fill='url(#bodyG)' stroke='#8a6416' stroke-width='1.5'/><path d='M50 2 C66 26 77 58 78 92 H22 C23 58 34 26 50 2Z' fill='url(#noseG)' stroke='#6e0a2e'/><rect x='22' y='92' width='56' height='6' fill='#d9a441'/><rect x='25' y='258' width='50' height='8' fill='#d9a441'/><circle cx='50' cy='118' r='11' fill='#14202e' stroke='#d9a441' stroke-width='3'/><circle cx='47' cy='115' r='3.5' fill='#7fe3ff' opacity='.85'/><path d='M34 270 H66 L72 296 H28Z' fill='#4a4f5c' stroke='#2a2e38' stroke-width='1.5'/><text id='rname' transform='translate(52,198) rotate(-90)' text-anchor='middle' dominant-baseline='middle' font-family='Cormorant Garamond,Georgia,serif' font-weight='700' font-size='24' fill='#7a1236' opacity='0'></text></svg></div>

<section class='st' id='s6'><div class='glass card'><h1 class='gold' id='byeT'>Happy Diwali 🪔</h1><p id='byeP' style='line-height:1.7;font-weight:300'>Thank you for celebrating with us. May your life shine bright, always!</p><button class='go' id='leave'>Leave website 🚪</button></div></section>

<section class="st" id="s1"><div class="ttl">Light the diyas 🪔</div><div class="dys" id="dys"></div></section>
<section class="st" id="s2"><div class="ttl">Chakri 🌀</div><div class="floor"></div><div id="ck"></div></section>
<section class="st" id="s3"><div class="ttl">Anaar ⛲</div><div class="floor"></div><div id="an"></div></section>
<section class="st" id="s4"><div class="ttl">Aalu Bomb 💣</div><div class="floor"></div><div id="bomb"><div id="fuse"><div id="fz"></div></div></div></section>

<div id="box">MATCH<br>BOX</div><div id="match"><i></i></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SECRET='';/* put your secret word here; empty = any word works */
let nk='',cname='',muted=false,AC,cur=0;
const A='bass lasan ye hi bacha tha 🤣🤣🤣 saalaa cringe',B='🤣🤣🤡 dekh k patake phodna';
const BS={deepak:A,aarshu:A,adarsh:A,somya:'dekho apke mareejo wale patake se better tha ye',yashika:B,arushi:B,sharita:'arre bangan waah 🤣😜'};
const C2='chal chutiye ye hi bacha tha karne k liye 🤣🤣🤣';
const RS={deepak:C2,aarshu:C2,adarsh:C2,yashika:'👀😍 aesthetic logo ki aesthetic Rangoli',arushi:'🥰🤩 are waah doctor Sahab kya rangoli banayi hai',somya:'🥰✨👀 kya baat hai poet nice colour selection',sharita:'tu rehne hi de 😆😂'};
let special=false;
/* audio */
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
function nz(d,t,f,g,f2){if(muted)return;try{const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),o=b.getChannelData(0);for(let i=0;i<n;i++)o[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=t;fl.frequency.setValueAtTime(f,a.currentTime);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);const gn=a.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(a.destination);s.start()}catch(e){}}
function tone(f,d,g,f2){if(muted)return;try{const a=ac(),o=a.createOscillator(),gn=a.createGain();o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);gn.gain.setValueAtTime(g,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
const strikeS=()=>nz(.18,'highpass',2500,.5),popS=()=>nz(.05,'bandpass',3000,.5);
function boom(){nz(2.4,'lowpass',1200,3,50);nz(.6,'highpass',600,1.5);tone(110,1.4,2,25);setTimeout(()=>nz(1.2,'lowpass',400,2,40),150)}
function clap(){for(let i=0;i<22;i++)setTimeout(()=>nz(.09,'bandpass',1700,.9),Math.random()*2600)}
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};
/* particles */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function em(x,y,vx,vy,l,c,s,g,sm){P.push({x,y,vx,vy,l,m:l,c,s,g,sm})}
const COL=['#fff','#ffd966','#ffb347','#ff4d8f','#7fe3ff','#9dff7a'];
const rc=()=>COL[Math.random()*COL.length|0];
